name: 发布安装包

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本，例如 1.0.0"
        required: true
        default: ""
      openwrt_ipk_version:
        description: "用于 ipk 构建的 OpenWrt 版本"
        required: true
        default: "23.05.5"
      openwrt_apk_version:
        description: "用于 apk 构建的 OpenWrt 版本"
        required: true
        default: "25.12.3"
      prerelease:
        description: "是否发布为预发布版本"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: 校验发布参数与源码
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 安装 Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: 校验版本号
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "版本号无效: $VERSION"
            exit 1
          fi

      - name: 检查 Shell 和 Lua 语法
        run: |
          set -euo pipefail
          bash -n root/usr/libexec/wireless-helper
          bash -n root/etc/init.d/wireless_helper
          bash -n root/etc/hotplug.d/usb/99-wireless-helper
          bash -n root/etc/uci-defaults/99-wireless-helper-permissions
          luac5.1 -p luasrc/controller/wireless_helper.lua
          luac5.1 -p luasrc/model/cbi/wireless_helper.lua

  build:
    name: 构建 ${{ matrix.format }}
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
            default_openwrt_version: "23.05.5"
          - format: apk
            default_openwrt_version: "25.12.3"

    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pip python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl zstd

      - name: 校验版本号
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "版本号无效: $VERSION"
            exit 1
          fi

      - name: 写入版本号
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            BEGIN { replaced=0 }
            /^PKG_VERSION:=/ { print "PKG_VERSION:=" ver; replaced=1; next }
            { print }
            END { if (!replaced) exit 2 }
          ' Makefile > Makefile.tmp
          mv Makefile.tmp Makefile
          grep -n '^PKG_VERSION:=' Makefile

      - name: 解析 OpenWrt SDK
        id: sdk
        env:
          REQUESTED_VERSION: ${{ matrix.format == 'ipk' && inputs.openwrt_ipk_version || inputs.openwrt_apk_version }}
          DEFAULT_VERSION: ${{ matrix.default_openwrt_version }}
        run: |
          set -euo pipefail
          VER="${REQUESTED_VERSION:-$DEFAULT_VERSION}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "OpenWrt 版本号无效: $VER"
            exit 1
          fi

          BASE_URL="https://downloads.openwrt.org/releases/${VER}/targets/x86/64"
          SDK_INDEX="$(curl -fsSL --retry 5 --retry-all-errors "${BASE_URL}/")"
          SDK_NAME="$(printf '%s' "$SDK_INDEX" \
            | grep -oE 'openwrt-sdk-[^"? ]+Linux-x86_64\.tar\.(zst|xz)' \
            | sort -u \
            | sed -n '1p' || true)"
          if [ -z "$SDK_NAME" ]; then
            echo "找不到 SDK: ${BASE_URL}"
            exit 1
          fi

          echo "sdk_url=${BASE_URL}/${SDK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sdk_name=${SDK_NAME}" >> "$GITHUB_OUTPUT"
          echo "openwrt_version=${VER}" >> "$GITHUB_OUTPUT"

      - name: 缓存 SDK 压缩包
        uses: actions/cache@v5
        with:
          path: sdk.tar
          key: sdk-v2-${{ runner.os }}-${{ steps.sdk.outputs.sdk_name }}

      - name: 下载并解压 SDK
        run: |
          set -euo pipefail
          if [ -f sdk.tar ] && ! tar -tf sdk.tar >/dev/null 2>&1; then
            echo "缓存的 SDK 压缩包已损坏，重新下载。"
            rm -f sdk.tar
          fi
          if [ ! -f sdk.tar ]; then
            curl -fL --retry 5 --retry-all-errors \
              "${{ steps.sdk.outputs.sdk_url }}" -o sdk.tar
          fi

          tar -tf sdk.tar >/dev/null
          rm -rf sdk openwrt
          mkdir -p sdk
          tar -xf sdk.tar -C sdk
          mapfile -t SDK_DIRS < <(find sdk -mindepth 1 -maxdepth 1 -type d -name 'openwrt-sdk-*')
          if [ "${#SDK_DIRS[@]}" -ne 1 ]; then
            echo "SDK 目录数量异常: ${#SDK_DIRS[@]}"
            find sdk -mindepth 1 -maxdepth 2 -print
            exit 1
          fi
          SDK_DIR="${SDK_DIRS[0]}"
          mv "$SDK_DIR" openwrt

      - name: 缓存 OpenWrt 下载目录
        uses: actions/cache@v5
        with:
          path: openwrt/dl
          key: dl-v2-${{ runner.os }}-${{ steps.sdk.outputs.openwrt_version }}-x86-64-${{ matrix.format }}

      - name: 更新 feeds
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            ./scripts/feeds update -a && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          ./scripts/feeds install -a

      - name: 注入软件包
        run: |
          set -euo pipefail
          mkdir -p openwrt/package/openwrt-wireless-helper
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "openwrt" \
            --exclude "sdk" \
            --exclude "artifacts" \
            ./ openwrt/package/openwrt-wireless-helper/

      - name: 生成配置
        working-directory: openwrt
        run: |
          set -euo pipefail
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_PACKAGE_openwrt-wireless-helper=m" >> .config
          make defconfig

      - name: 编译软件包
        working-directory: openwrt
        run: |
          set -euo pipefail
          make package/openwrt-wireless-helper/{clean,compile} -j1 V=s

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p artifacts
          EXT="${{ matrix.format }}"
          if [ "$EXT" = "ipk" ]; then
            find openwrt/bin -type f -name "openwrt-wireless-helper_*.ipk" -exec cp -v {} artifacts/ \;
          else
            find openwrt/bin -type f -name "openwrt-wireless-helper-*.apk" -exec cp -v {} artifacts/ \;
          fi

          if [ -z "$(ls artifacts/*.${EXT} 2>/dev/null)" ]; then
            echo "没有找到 ${EXT} 产物。"
            echo "=== openwrt-wireless-helper 相关文件 ==="
            find openwrt -type f -name "openwrt-wireless-helper*" | sort || true
            echo "=== 所有包产物 ==="
            find openwrt/bin -type f \( -name "*.ipk" -o -name "*.apk" \) | sort || true
            exit 1
          fi
          ls -lh artifacts/

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-wireless-helper-${{ matrix.format }}
          path: artifacts/*.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 发布到 GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 下载构建产物
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: openwrt-wireless-helper-*
          merge-multiple: true

      - name: 生成发布说明
        env:
          VERSION: ${{ inputs.version }}
          IPK_VERSION: ${{ inputs.openwrt_ipk_version }}
          APK_VERSION: ${{ inputs.openwrt_apk_version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          OPENWRT_VERSION="ipk: $IPK_VERSION / apk: $APK_VERSION"
          if [ "$IS_PRERELEASE" = "true" ]; then
            TEMPLATE=".github/prerelease-template.md"
          else
            TEMPLATE=".github/release-template.md"
          fi

          sed \
            -e "s|\${VERSION}|${VERSION}|g" \
            -e "s|\${OPENWRT_VERSION}|${OPENWRT_VERSION}|g" \
            "$TEMPLATE" > release-notes.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: release-assets/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ inputs.prerelease }}
          overwrite_files: true
